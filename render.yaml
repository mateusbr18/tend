# The Shapeless Team — three services, one codebase, one database.
#   tend            → values tool; owns the SQLite database and the API
#   skills-matrix   → skills tool; talks to the tend API across domains (CORS is on)
#   shapeless-hub   → landing page linking to both
# Each has its own public *.onrender.com URL. They are written here explicitly:
# `fromService … property: host` gives Render's internal hostname, not the public one.
# Free plan: services sleep when idle, and the database is re-seeded on every deploy
# (no persistent disk).
services:
  - type: web
    name: tend
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP
        value: tend
      - key: HUB_URL
        value: https://shapeless-hub.onrender.com
      - key: SKILLS_URL
        value: https://skills-matrix-4plr.onrender.com

  - type: web
    name: skills-matrix
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP
        value: skills
      - key: API_BASE
        value: https://tend-0qpy.onrender.com
      - key: TEND_URL
        value: https://tend-0qpy.onrender.com
      - key: HUB_URL
        value: https://shapeless-hub.onrender.com

  - type: web
    name: shapeless-hub
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP
        value: hub
      - key: TEND_URL
        value: https://tend-0qpy.onrender.com
      - key: SKILLS_URL
        value: https://skills-matrix-4plr.onrender.com
